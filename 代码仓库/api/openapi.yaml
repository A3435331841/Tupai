openapi: 3.1.0
info:
  title: 图派 TuPai API
  version: 1.2.0
  description: |
    前后端分离的唯一通信契约（文档摘要见 docs/07-接口契约.md）。
    冻结规则：v1 只增不改不删；破坏性变更升 /api/v2。
    游客身份：前端生成 UUID 存 localStorage，每请求带 X-Session-Id 头。
    登录态：Qoder 平台网关注入 x-qoder-user-context（浏览器不可伪造）；需登录端点会返回 401 login_required。
    所有结果图 URL 均为本站转存后的 URL，不暴露第三方 COS 直链。
    2026-11-18 v1.1：补齐二期资产库/画册/分享与三期社区/任务/通知/账号全部已实现端点。
servers:
  - url: /api/v1
  - url: /functions/v1/app/api/v1
    description: Sites 同源传输前缀；云函数剥离 /functions/v1/app 后按 /api/v1 契约路由（2026-11-17 增补，只增不改）
security:
  - SessionId: []
tags:
  - name: assets
  - name: catalog
  - name: optimize
  - name: jobs
  - name: skills
  - name: links
  - name: account
  - name: albums
  - name: share
  - name: community
  - name: tasks
  - name: notifications

paths:
  /assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: 当前所有者资产列表（筛选/分页/回收站）
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [original, result, reference] }
        - name: q
          in: query
          schema: { type: string, description: 匹配 source / tags / kind }
        - name: tag
          in: query
          schema: { type: string }
        - name: include_deleted
          in: query
          schema: { type: string, enum: ["1"] }
        - name: only_deleted
          in: query
          description: 仅返回回收站资产（deleted_at 非空）；与 include_deleted 同时出现时以本参数为准
          schema: { type: string, enum: ["1"] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: 资产分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "400": { $ref: "#/components/responses/BadInput" }
    post:
      tags: [assets]
      operationId: uploadAsset
      summary: 上传图片（original 默认私有）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum: [original, reference]
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetUploaded" }
        "400": { $ref: "#/components/responses/BadInput" }
        "413": { $ref: "#/components/responses/BadInput" }

  /assets/{id}/content:
    get:
      tags: [assets]
      operationId: getAssetContent
      summary: 取图片字节（私有校验会话归属）
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: 图片字节
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404": { $ref: "#/components/responses/NotFound" }

  /templates:
    get:
      tags: [catalog]
      operationId: listTemplates
      summary: 模板列表（含 tags 与预览）
      responses:
        "200":
          description: 模板列表
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }

  /models:
    get:
      tags: [catalog]
      operationId: listModels
      summary: 可选模型列表（服务端白名单，前端不硬编码模型 ID）
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }

  /quota:
    get:
      tags: [jobs]
      operationId: getQuota
      summary: 当前会话今日生成配额（生成次数上限与剩余）
      responses:
        "200":
          description: 配额
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }

  /optimize:
    post:
      tags: [optimize]
      operationId: optimizePrompt
      summary: 图片/文字 → 候选提示词 + 相似推荐（同步，3–10s）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimizeRequest" }
      responses:
        "200":
          description: 候选与推荐；无相似匹配时 recommendations 为空数组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizeResponse" }
        "400": { $ref: "#/components/responses/BadInput" }
        "429": { $ref: "#/components/responses/ProviderBusy" }

  /jobs/generate:
    post:
      tags: [jobs]
      operationId: createGenerateJob
      summary: 创建生成任务（异步）；缺省 asset_id = 文生图
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobCreated" }
        "400": { $ref: "#/components/responses/BadInput" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /jobs/{id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 查询任务状态与结果（建议轮询间隔 2s，60s 未终态提示超时）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 任务状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }

  /skills:
    get:
      tags: [skills]
      operationId: listSkills
      summary: 当前会话保存过的 Skills 配方（最新 50 条）
      responses:
        "200":
          description: 配方列表
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/TupaiSkill"
                        - type: object
                          required: [skill_id]
                          properties:
                            skill_id: { type: string }
    post:
      tags: [skills]
      operationId: saveSkill
      summary: 保存 Skill（tupai-skill-v1 JSON）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TupaiSkill" }
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [skill_id]
                properties:
                  skill_id: { type: string }
        "400": { $ref: "#/components/responses/BadInput" }

  /skills/import:
    post:
      tags: [skills]
      operationId: importSkill
      summary: 校验导入 Skill 并回填创作台
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TupaiSkill" }
      responses:
        "200":
          description: 校验通过，直接返回带 skill_id 的完整配方
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TupaiSkill"
                  - type: object
                    required: [skill_id]
                    properties:
                      skill_id: { type: string }
        "422": { $ref: "#/components/responses/BadInput" }

  /skills/{id}:
    get:
      tags: [skills]
      operationId: getSkill
      summary: 取 Skill JSON
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: tupai-skill-v1 字段 + skill_id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TupaiSkill"
                  - type: object
                    required: [skill_id]
                    properties:
                      skill_id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [skills]
      operationId: updateSkill
      summary: 更新配方（标题/提示词/负向/模型/标签/备注）
      parameters:
        - $ref: "#/components/parameters/SkillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                prompt: { type: string, maxLength: 4000 }
                negative_prompt: { type: [string, "null"], maxLength: 1000 }
                model: { type: string }
                style_tags:
                  type: array
                  maxItems: 12
                  items: { type: string, maxLength: 40 }
                notes: { type: string, maxLength: 300 }
      responses:
        "200":
          description: 更新后的配方
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TupaiSkill" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadInput" }
    delete:
      tags: [skills]
      operationId: deleteSkill
      summary: 删除配方（不影响已发布作品的配方快照）
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }

  /skills/{id}/skill.md:
    get:
      tags: [skills]
      operationId: exportSkillMarkdown
      summary: 导出 Agent Skills 格式 SKILL.md（前端触发下载）
      parameters:
        - $ref: "#/components/parameters/SkillId"
      responses:
        "200":
          description: SKILL.md 文本
          content:
            text/markdown:
              schema:
                type: string
        "404": { $ref: "#/components/responses/NotFound" }

  /links/parse:
    post:
      tags: [links]
      operationId: parseLink
      summary: 扩展：尽力解析抖音单条图文链接，返回图片地址与文案
      description: 返回的图片地址来自第三方 CDN。前端继续创作时会将取回的图片作为私有原图上传保存，当前没有专门的自动清理。
      description: 此端点失败不影响任何 MVP 路径；视频链接/风控拦截返回 422 降级引导。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: 抖音分享短链或图文页链接
      responses:
        "200":
          description: 解析成功；temp_url 为第三方地址，expires_at 不保证其实际失效时间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkParseResult" }
        "422":
          description: 解析失败（parse_failed），前端引导手动上传
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /health:
    get:
      tags: [catalog]
      operationId: health
      summary: 健康检查与 Key 配置状态（无需会话）
      security: []
      responses:
        "200":
          description: 服务状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /templates/{id}/cover:
    get:
      tags: [catalog]
      operationId: getTemplateCover
      summary: 模板封面图（懒生成；限流时返回 SVG 占位）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 封面图字节
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: 当前登录态（游客也可调用，logged_in=false）
      responses:
        "200":
          description: 登录态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [account]
      operationId: deleteMe
      summary: 注销并真删当前所有者的作品/资产/画册/配方等内容
      responses:
        "200":
          description: 已注销
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }

  /me/profile:
    get:
      tags: [account]
      operationId: getMyProfile
      summary: 当前登录用户的资料（昵称/简介/头像）
      security:
        - SessionId: []
          QoderUserContext: []
      responses:
        "200":
          description: 资料
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/LoginRequired" }
    patch:
      tags: [account]
      operationId: updateMyProfile
      summary: 更新昵称 / 简介
      security:
        - SessionId: []
          QoderUserContext: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 30 }
                bio: { type: string, maxLength: 200 }
      responses:
        "200":
          description: 更新后的资料
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/LoginRequired" }

  /auth/bind:
    post:
      tags: [account]
      operationId: bindGuestData
      summary: 将游客会话数据迁移到当前登录用户
      security:
        - SessionId: []
          QoderUserContext: []
      responses:
        "200":
          description: 迁移结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BindResult" }
        "401": { $ref: "#/components/responses/LoginRequired" }

  /assets/{id}:
    get:
      tags: [assets]
      operationId: getAssetMeta
      summary: 资产元数据（仅所有者）
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: 资产元数据
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: "#/components/schemas/AssetMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [assets]
      operationId: updateAssetTags
      summary: 更新资产标签（最多 12 个，每个 ≤40 字）
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetTagsPatch" }
      responses:
        "200":
          description: 更新后的资产元数据
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: "#/components/schemas/AssetMeta" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [assets]
      operationId: deleteAsset
      summary: 软删资产入回收站；purge=1 时彻底删除（须已在回收站，且无关联作品）
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - name: purge
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 已软删或彻底删除
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeletedAt"
                  - type: object
                    properties:
                      ok: { type: boolean }
                      purged: { type: boolean }
        "400": { $ref: "#/components/responses/BadInput" }
        "409": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /assets/{id}/restore:
    post:
      tags: [assets]
      operationId: restoreAsset
      summary: 从回收站恢复资产
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: 恢复后的资产元数据
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: "#/components/schemas/AssetMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /albums:
    get:
      tags: [albums]
      operationId: listAlbums
      summary: 当前所有者的画册列表
      responses:
        "200":
          description: 画册列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumList" }
    post:
      tags: [albums]
      operationId: createAlbum
      summary: 创建画册（只收 result 资产）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [album]
                properties:
                  album: { $ref: "#/components/schemas/AlbumMeta" }
        "400": { $ref: "#/components/responses/BadInput" }

  /albums/{id}:
    get:
      tags: [albums]
      operationId: getAlbum
      summary: 画册详情（仅所有者）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 画册
          content:
            application/json:
              schema:
                type: object
                required: [album]
                properties:
                  album: { $ref: "#/components/schemas/AlbumMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [albums]
      operationId: updateAlbum
      summary: 更新画册标题/作品集
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumPatch" }
      responses:
        "200":
          description: 更新后的画册
          content:
            application/json:
              schema:
                type: object
                required: [album]
                properties:
                  album: { $ref: "#/components/schemas/AlbumMeta" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [albums]
      operationId: deleteAlbum
      summary: 删除画册
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }

  /albums/{id}/share:
    post:
      tags: [albums]
      operationId: shareAlbum
      summary: 生成只读分享链接（默认 7 天，可设 1–720 小时）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_hours: { type: integer, minimum: 1, maximum: 720, default: 168 }
      responses:
        "200":
          description: 分享信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumShare" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [albums]
      operationId: revokeAlbumShare
      summary: 撤回分享（停止新访问）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }

  /share/{token}:
    get:
      tags: [share]
      operationId: getShareView
      summary: 只读分享视图（无需登录）
      description: 仅返回仍存活（未软删且 kind=result）的条目，保持画册原顺序
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: 分享内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareView" }
        "404": { $ref: "#/components/responses/NotFound" }

  /share/{token}/img/{assetId}:
    get:
      tags: [share]
      operationId: getShareImage
      summary: 分享作品图（只读、仅 result 资产）
      description: 资产被软删（deleted_at 非空）或不在该画册中时返回 404
      parameters:
        - $ref: "#/components/parameters/Token"
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 图片字节
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /share/{token}/page:
    get:
      tags: [share]
      operationId: getSharePage
      summary: 自包含只读翻页画册页（HTML）
      description: 与 /share/{token} 相同，仅渲染仍存活（未软删且 kind=result）的条目
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: HTML 页面
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /works:
    post:
      tags: [community]
      operationId: publishWork
      summary: 发布作品（登录必需；审核 gate；默认允许 fork）
      security:
        - SessionId: []
          QoderUserContext: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkCreate" }
      responses:
        "201":
          description: 已发布
          content:
            application/json:
              schema:
                type: object
                required: [work]
                properties:
                  work: { $ref: "#/components/schemas/WorkMeta" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadInput" }

  /feed:
    get:
      tags: [community]
      operationId: getFeed
      summary: 发现页（标签/搜索/最新或热门）
      parameters:
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [new, hot], default: new }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: 作品分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }

  /works/{id}:
    get:
      tags: [community]
      operationId: getWork
      summary: 作品页（含配方/lineage/计数；未公开仅作者可见）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 作品
          content:
            application/json:
              schema:
                type: object
                required: [work]
                properties:
                  work: { $ref: "#/components/schemas/WorkMeta" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [community]
      operationId: updateWork
      summary: 作者编辑作品标题/标签/是否允许 fork（不改状态）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                tags:
                  type: array
                  maxItems: 12
                  items: { type: string, maxLength: 40 }
                allow_fork: { type: boolean }
      responses:
        "200":
          description: 更新后的作品
          content:
            application/json:
              schema:
                type: object
                required: [work]
                properties:
                  work: { $ref: "#/components/schemas/WorkMeta" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadInput" }
    delete:
      tags: [community]
      operationId: deleteWork
      summary: 删除作品（标记 removed；保留子 fork 的来源指针，上游不可见时由前端提示）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }

  /works/{id}/img:
    get:
      tags: [community]
      operationId: getWorkImage
      summary: 作品结果图（未公开仅作者可见）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 图片字节
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /works/{id}/fork:
    post:
      tags: [community]
      operationId: forkWork
      summary: 取 fork 配方（不携带他人底图）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 配方与 lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkFork" }
        "400": { $ref: "#/components/responses/BadInput" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /works/{id}/withdraw:
    post:
      tags: [community]
      operationId: withdrawWork
      summary: 撤回作品（停止新 fork；已有 fork 保留并标注来源）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /works/{id}/publish:
    post:
      tags: [community]
      operationId: republishWork
      summary: 重新发布已撤回作品（重新过审）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkStatus" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadInput" }

  /works/{id}/report:
    post:
      tags: [community]
      operationId: reportWork
      summary: 举报作品；同一举报人只计一次，累计 3 次自动下架
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: 举报已记录（already=true 表示重复举报）
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  already: { type: boolean }
        "400": { $ref: "#/components/responses/BadInput" }

  /works/{id}/appeal:
    post:
      tags: [community]
      operationId: appealWork
      summary: 被下架作品申诉（重新审核）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 申诉通过，已恢复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkStatus" }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadInput" }

  /works/{id}/comments:
    get:
      tags: [community]
      operationId: listComments
      summary: 评论列表（隐藏评论不返回）
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: 评论列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [community]
      operationId: addComment
      summary: 发表评论（登录必需；每小时最多 20 条）
      security:
        - SessionId: []
          QoderUserContext: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentCreate" }
      responses:
        "201":
          description: 已发表
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "422": { $ref: "#/components/responses/BadInput" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /comments/{id}:
    delete:
      tags: [community]
      operationId: deleteComment
      summary: 删除评论（本人真删）或作者隐藏（作品作者）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已删除或隐藏
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  hidden: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /works/{id}/like:
    post:
      tags: [community]
      operationId: toggleLike
      summary: 点赞/取消点赞（登录必需）
      security:
        - SessionId: []
          QoderUserContext: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 当前点赞状态
          content:
            application/json:
              schema:
                type: object
                required: [liked]
                properties:
                  liked: { type: boolean }
                  like_count: { type: integer, description: 当前作品点赞总数 }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/works:
    get:
      tags: [community]
      operationId: getUserWorks
      summary: 作者公开作品列表
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 作品列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }

  /me/works:
    get:
      tags: [community]
      operationId: getMyWorks
      summary: 我的全部作品（含未公开）
      responses:
        "200":
          description: 作品列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkList" }

  /me/export:
    get:
      tags: [account]
      operationId: exportMe
      summary: 导出当前所有者的作品/配方/画册
      responses:
        "200":
          description: 导出包
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportBundle" }

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 共创任务列表（默认仅进行中；include_closed=1 额外含本人已关闭）
      parameters:
        - name: include_closed
          in: query
          description: 传 1 时额外返回当前用户自己发起的已关闭任务
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: 发起共创任务（登录必需；每天最多 5 个）
      security:
        - SessionId: []
          QoderUserContext: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/TaskMeta" }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }

  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: 任务详情与提交作品
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 任务与作品
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: updateTaskStatus
      summary: 发起人关闭/重新开放任务
      security:
        - SessionId: []
          QoderUserContext: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/TaskMeta" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/submissions:
    post:
      tags: [tasks]
      operationId: submitTaskWork
      summary: 提交自己的已发布作品（登录必需）
      security:
        - SessionId: []
          QoderUserContext: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [work_id]
              properties:
                work_id: { type: string }
      responses:
        "201":
          description: 已提交（already=true 表示已提交过）
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  already: { type: boolean }
        "400": { $ref: "#/components/responses/BadInput" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/submissions/{workId}:
    delete:
      tags: [tasks]
      operationId: withdrawSubmission
      summary: 投稿人撤回投稿（任务发起人也可移除）
      security:
        - SessionId: []
          QoderUserContext: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 已撤回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/LoginRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 当前所有者的通知（最新 50 条）
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }

  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: readNotification
      summary: 标记通知已读
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 已读
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: readAllNotifications
      summary: 全部标记已读
      responses:
        "200":
          description: 已全部标记
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  updated: { type: integer }

  /maintenance/cleanup:
    post:
      tags: [account]
      operationId: runCleanup
      summary: 平台定时清理（需 x-maintenance-token 与 MAINTENANCE_TOKEN 环境变量一致）
      description: 彻底删除回收站超过 7 天的资产、过期分享、30 天前的任务记录；未配置 token 时该端点返回 404。
      parameters:
        - name: x-maintenance-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 清理结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  assets_purged: { type: integer }
                  shares_expired: { type: integer }
                  jobs_purged: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/review:
    get:
      tags: [account]
      operationId: listReviewQueue
      summary: 审核降级的人工复核队列（需 x-maintenance-token）
      parameters:
        - name: x-maintenance-token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 待复核作品
          content:
            application/json:
              schema:
                type: object
                properties:
                  works:
                    type: array
                    items: { $ref: "#/components/schemas/WorkMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/works/{id}/review:
    post:
      tags: [account]
      operationId: reviewWork
      summary: 人工复核通过或下架（需 x-maintenance-token）
      parameters:
        - name: x-maintenance-token
          in: header
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, remove] }
      responses:
        "200":
          description: 复核结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

  /showcase/skills:
    get:
      tags: [community]
      operationId: listShowcaseSkills
      summary: 技能演示列表（公开只读种子内容；每技能一本画册 + 原图→作品示例对）
      description: 由维护端点 seed-showcase 写入；只返回已配置示例对的技能。cover 提供第一组原图/作品对比图地址。
      responses:
        "200":
          description: 技能列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: "#/components/schemas/ShowcaseSkill" }

  /showcase/skills/{id}:
    get:
      tags: [community]
      operationId: getShowcaseSkill
      summary: 技能演示详情（全部示例对 + 画册只读分享地址）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: 技能详情与示例对
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill: { $ref: "#/components/schemas/ShowcaseSkill" }
                  pairs:
                    type: array
                    items:
                      type: object
                      properties:
                        original_url: { type: string }
                        result_url: { type: string }
                        result_asset_id: { type: string }
                  album:
                    type: object
                    nullable: true
                    properties:
                      share_token: { type: string }
                      share_page: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /showcase/img/{assetId}:
    get:
      tags: [community]
      operationId: getShowcaseImage
      summary: 技能演示图（仅限种子对中登记的原图/作品；用户资产不在此暴露）
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, pattern: "^a_[0-9a-f]{24}$" }
      responses:
        "200":
          description: 图片字节
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/seed-showcase:
    post:
      tags: [account]
      operationId: seedShowcase
      summary: 批量幂等写入技能演示种子（需 x-maintenance-token；分批调用）
      description: |
        一次调用可包含三段：skills（技能元数据，同步模板表）、pairs（slot 必须顺续，重复调用跳过已写入槽位）、
        albums（按技能定稿画册并生成稳定只读分享令牌）。资产 id 与画册/令牌均由 skill+slot 哈希决定，可安全重放。
      parameters:
        - name: x-maintenance-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skills:
                  type: array
                  items:
                    type: object
                    required: [id, title_zh, category, prompt]
                    properties:
                      id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
                      title_zh: { type: string }
                      category: { type: string }
                      desc_zh: { type: string }
                      tags: { type: array, items: { type: string } }
                      prompt: { type: string }
                      negative_prompt: { type: string }
                      model: { type: string }
                      ratio: { type: string }
                      sort: { type: integer }
                pairs:
                  type: array
                  items:
                    type: object
                    required: [skill_id, slot, original, result]
                    properties:
                      skill_id: { type: string }
                      slot: { type: integer }
                      original:
                        type: object
                        required: [b64]
                        properties:
                          b64: { type: string }
                          mime: { type: string }
                      result:
                        type: object
                        required: [b64]
                        properties:
                          b64: { type: string }
                          mime: { type: string }
                albums:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 写入统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  skills: { type: integer }
                  templates: { type: integer }
                  assets: { type: integer }
                  pairs: { type: integer }
                  albums: { type: integer }
                  skipped_pairs: { type: integer }
        "400": { $ref: "#/components/responses/BadInput" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    SessionId:
      type: apiKey
      in: header
      name: X-Session-Id
      description: 游客会话 UUID（localStorage 持久）
    QoderUserContext:
      type: apiKey
      in: header
      name: x-qoder-user-context
      description: Qoder 平台网关注入的已验证用户上下文（base64url JSON）；浏览器不可伪造，本地测试用身份夹具模拟。

  parameters:
    AssetId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SkillId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, description: 资源 ID（a_/al_/wk_/cm_/tk_/nt_ 前缀 + 24 位 hex） }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }

  responses:
    BadInput:
      description: 输入校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: 资源不存在或不属于当前会话
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ProviderBusy:
      description: 上游限流降级（provider_busy），前端展示降级候选
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    QuotaExceeded:
      description: 游客配额用尽（quota_exceeded）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    LoginRequired:
      description: 需要登录（login_required）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: 无权限或作者已关闭 fork（invalid_input / 403）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_input, quota_exceeded, provider_busy, parse_failed, not_found, internal, login_required, invalid_user_context]
            message:
              type: string
              description: 人类可读中文

    AssetUploaded:
      type: object
      required: [asset_id, kind, preview_url]
      properties:
        asset_id: { type: string }
        kind:
          type: string
          enum: [original, reference]
        width: { type: integer }
        height: { type: integer }
        preview_url: { type: string }

    TemplateVariant:
      type: object
      required: [id, label, prompt]
      properties:
        id: { type: string }
        label: { type: string }
        prompt: { type: string }
        negative_prompt: { type: string }

    Template:
      type: object
      required: [id, title, description, cover_url, prompt, default_model, tags]
      properties:
        id: { type: string, description: slug }
        title: { type: string }
        description: { type: string }
        cover_url: { type: string }
        prompt: { type: string, description: 图生图提示词；有底图时使用 }
        negative_prompt: { type: string }
        sample_prompt: { type: [string, "null"], description: 文生图示意提示词；无底图时使用，与封面同源 }
        variants:
          type: array
          items: { $ref: "#/components/schemas/TemplateVariant" }
        default_model: { type: string }
        ratio: { type: string }
        tags:
          type: array
          items: { type: string }

    Model:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        default: { type: boolean }

    OptimizeRequest:
      type: object
      description: asset_id 与 text 至少一个
      properties:
        asset_id: { type: string }
        text: { type: string }
        count:
          type: integer
          minimum: 2
          maximum: 4
          default: 3

    PromptCandidate:
      type: object
      required: [prompt, style_tags]
      properties:
        summary_zh: { type: string, description: 中文一句话摘要，供普通用户判断 }
        prompt: { type: string }
        negative_prompt: { type: string }
        style_tags:
          type: array
          items: { type: string }

    Recommendation:
      type: object
      required: [type, id, title, cover_url, prompt]
      properties:
        type:
          type: string
          enum: [template, skill]
        id: { type: string }
        title: { type: string }
        description: { type: string }
        cover_url: { type: string }
        cover_private: { type: boolean, description: 私有封面需带会话头读取 }
        score: { type: number }
        match_tags:
          type: array
          items: { type: string }
        prompt: { type: string }
        negative_prompt: { type: string }
        model: { type: string }
        default_model: { type: string }
        ratio: { type: string }
        sample_prompt: { type: [string, "null"] }
        variants:
          type: array
          items: { $ref: "#/components/schemas/TemplateVariant" }

    OptimizeResponse:
      type: object
      required: [candidates, recommendations, mode]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PromptCandidate" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        recommendations_fallback: { type: boolean, description: 无匹配时为 true，返回模板兜底 }
        mode:
          type: string
          enum: [img2img, txt2img]

    GenerateRequest:
      type: object
      required: [prompt, model]
      properties:
        asset_id:
          type: string
          description: 可选；缺省 = 文生图
        prompt: { type: string }
        negative_prompt: { type: string }
        model: { type: string }
        ratio:
          type: string
          enum: ["1:1", "3:4", "4:3", "16:9", "9:16", "2:3", "3:2", "21:9"]
          default: "3:4"

    JobCreated:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued]

    JobResult:
      type: object
      required: [asset_id, url]
      properties:
        asset_id: { type: string }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        mock:
          type: boolean
          description: true 表示由演示兜底生成（未接真实模型），前端可据此提示

    Job:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          oneOf:
            - $ref: "#/components/schemas/JobResult"
            - type: "null"
        error:
          description: 失败时的错误体，与实现一致为 {code, message}
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
            - type: "null"

    TupaiSkill:
      type: object
      description: tupai-skill-v1 配方（需求文档 §5.1）；字段可增不可改语义
      required: [format, version, title, prompt, model]
      properties:
        format:
          type: string
          enum: [tupai-skill]
        version:
          type: integer
          enum: [1]
        title: { type: string }
        prompt: { type: string }
        negative_prompt: { type: string }
        model: { type: string }
        template_id: { type: string }
        params:
          type: object
          properties:
            aspect: { type: string }
            size: { type: string }
        notes: { type: string }
        style_tags:
          type: array
          items: { type: string }
        cover_url:
          type: string
          description: 可选私有封面（本站资产逻辑路径，仅同会话可读）
        created_at: { type: string }

    Quota:
      type: object
      required: [session_used, session_limit, global_used, global_limit, remaining]
      properties:
        session_used: { type: integer }
        session_limit: { type: integer }
        global_used: { type: integer }
        global_limit: { type: integer }
        remaining: { type: integer }

    LinkParseResult:
      type: object
      required: [source_url, images]
      properties:
        source_url: { type: string }
        text:
          type: string
          description: 文案，可能为空
        images:
          type: array
          items:
            type: object
            required: [temp_url, expires_at]
            properties:
              temp_url: { type: string }
              expires_at: { type: string }

    Health:
      type: object
      required: [ok, service, keys_configured]
      properties:
        ok: { type: boolean }
        service: { type: string }
        keys_configured: { type: boolean, description: 云函数是否配置了 Agnes Key }

    Me:
      type: object
      required: [logged_in]
      properties:
        logged_in: { type: boolean }
        user:
          oneOf:
            - type: object
              required: [user_id, name, picture]
              properties:
                user_id: { type: string }
                name: { type: string }
                picture: { type: string }
            - type: "null"
        owner_key:
          type: [string, "null"]
          description: 当前归属键（u:<user_id> 或游客 session）

    BindResult:
      type: object
      required: [migrated, owner_key]
      properties:
        migrated: { type: integer, description: 迁移的记录数（assets/skills/jobs/albums） }
        owner_key: { type: string }

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    Deleted:
      type: object
      required: [ok, deleted]
      properties:
        ok: { type: boolean }
        deleted: { type: boolean }
        storage_failed: { type: integer, description: 存储对象删除失败数 }
        partial: { type: boolean, description: 部分存储对象未删除，需后续清理 }

    DeletedAt:
      type: object
      required: [ok, deleted_at]
      properties:
        ok: { type: boolean }
        deleted_at: { type: string, format: date-time }

    AssetMeta:
      type: object
      required: [id, kind, visibility, width, height, content_type, bytes, created_at, tags, content_url]
      properties:
        id: { type: string }
        kind: { type: string, enum: [original, result, reference] }
        visibility: { type: string, enum: [private, public] }
        width: { type: integer }
        height: { type: integer }
        content_type: { type: string }
        bytes: { type: integer }
        created_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }
        source: { type: [string, "null"] }
        deleted_at: { type: [string, "null"], format: date-time }
        ai_generated: { type: boolean, description: result 资产为 AI 生成结果图 }
        content_url: { type: string }

    AssetList:
      type: object
      required: [assets, total, next_offset]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/AssetMeta" }
        total: { type: integer }
        summary:
          type: object
          description: 各 kind 的资产数量（回收站模式不返回）
          properties:
            original: { type: integer }
            result: { type: integer }
            reference: { type: integer }
        next_offset: { type: [integer, "null"] }

    AssetTagsPatch:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 40 }

    AlbumMeta:
      type: object
      required: [id, title, item_ids, template_id, visibility, render_status, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        cover_asset_id: { type: [string, "null"] }
        item_ids:
          type: array
          items: { type: string }
        template_id: { type: string, description: 当前固定 3d-book }
        visibility: { type: string, enum: [private, unlisted] }
        render_status: { type: string }
        share_token: { type: [string, "null"] }
        share_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AlbumList:
      type: object
      required: [albums]
      properties:
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumMeta" }

    AlbumCreate:
      type: object
      required: [title, item_ids]
      properties:
        title: { type: string, maxLength: 100 }
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, description: 只接受 result 资产 }

    AlbumPatch:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string }

    AlbumShare:
      type: object
      required: [share_token, share_page, expires_at]
      properties:
        share_token: { type: string }
        share_page: { type: string, description: "/api/v1/share/{token}/page" }
        expires_at: { type: string, format: date-time }

    ShareView:
      type: object
      required: [title, images]
      properties:
        title: { type: string }
        created_at: { type: string, format: date-time }
        images:
          type: array
          items: { type: string, description: "/api/v1/share/{token}/img/{assetId}" }

    WorkSkillSnapshot:
      type: object
      required: [prompt, model, ratio]
      properties:
        prompt: { type: string, maxLength: 4000 }
        negative_prompt: { type: [string, "null"] }
        model: { type: string }
        ratio: { type: string }

    WorkCreate:
      type: object
      required: [result_asset_id, title, skill_snapshot]
      properties:
        result_asset_id: { type: string, description: 仅接受 result 资产 }
        title: { type: string, maxLength: 100 }
        tags:
          type: array
          maxItems: 12
          items: { type: string }
        allow_fork: { type: boolean, default: true }
        parent_work_id: { type: string, description: fork 来源作品 }
        skill_snapshot: { $ref: "#/components/schemas/WorkSkillSnapshot" }

    WorkMeta:
      type: object
      required: [id, title, tags, status, allow_fork, depth, author_id, result_asset_id, image_url, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [pending, published, withdrawn, removed] }
        allow_fork: { type: boolean }
        parent_work_id: { type: [string, "null"] }
        parent_skill_id: { type: [string, "null"] }
        depth: { type: integer }
        author_credit: { type: [string, "null"] }
        author_id: { type: string }
        result_asset_id: { type: string }
        skill_snapshot:
          oneOf:
            - $ref: "#/components/schemas/WorkSkillSnapshot"
            - type: "null"
        image_url: { type: string }
        created_at: { type: string, format: date-time }
        like_count: { type: integer }
        comment_count: { type: integer }
        fork_count: { type: integer }
        liked: { type: boolean, description: 当前会话/用户是否已点赞 }
        ai_generated: { type: boolean, description: 结果图均为 AI 生成 }
        moderation_degraded: { type: boolean, description: 审核服务不可用时降级发布，需人工复核 }
        is_owner: { type: boolean }

    WorkList:
      type: object
      required: [works]
      properties:
        works:
          type: array
          items: { $ref: "#/components/schemas/WorkMeta" }
        total: { type: integer }
        next_offset: { type: [integer, "null"] }

    ShowcaseSkill:
      type: object
      required: [id, title_zh, category, pair_count]
      properties:
        id: { type: string }
        title_zh: { type: string }
        category: { type: string }
        desc_zh: { type: string }
        tags: { type: array, items: { type: string } }
        prompt: { type: [string, "null"], description: 技能配方提示词（图生图编辑指令） }
        negative_prompt: { type: [string, "null"] }
        model: { type: [string, "null"] }
        ratio: { type: string }
        pair_count: { type: integer }
        cover:
          type: object
          nullable: true
          properties:
            original_url: { type: string }
            result_url: { type: string }
        sort: { type: integer }

    WorkFork:
      type: object
      required: [skill_snapshot, parent_work_id, parent_skill_id, depth, title]
      properties:
        skill_snapshot: { $ref: "#/components/schemas/WorkSkillSnapshot" }
        parent_work_id: { type: string }
        parent_skill_id: { type: string }
        depth: { type: integer }
        title: { type: string }

    WorkStatus:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [published, withdrawn, removed] }

    Comment:
      type: object
      required: [id, body, author_id, created_at]
      properties:
        id: { type: string }
        body: { type: string }
        author_id: { type: string }
        author_name: { type: string, description: 显示名，游客为「匿名用户」 }
        created_at: { type: string, format: date-time }

    CommentList:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        has_more: { type: boolean }
        next_offset: { type: integer }

    CommentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 500 }

    TaskMeta:
      type: object
      description: 列表/详情返回完整字段；POST/PATCH 仅回 id/theme/status
      required: [id, theme]
      properties:
        id: { type: string }
        theme: { type: string }
        constraints: { type: [string, "null"] }
        status: { type: string, enum: [open, closed] }
        owner_id: { type: string }
        submission_count: { type: integer }
        is_owner: { type: boolean }
        created_at: { type: string, format: date-time }

    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskMeta" }

    TaskCreate:
      type: object
      required: [theme]
      properties:
        theme: { type: string, maxLength: 100 }
        constraints: { type: string, maxLength: 500 }

    TaskDetail:
      type: object
      required: [task, works]
      properties:
        task: { $ref: "#/components/schemas/TaskMeta" }
        works:
          type: array
          items: { $ref: "#/components/schemas/WorkMeta" }

    NotificationMeta:
      type: object
      required: [id, kind, read, created_at]
      properties:
        id: { type: string }
        kind: { type: string, description: fork/comment/like/submission/removed 等 }
        work_id: { type: [string, "null"] }
        body: { type: [string, "null"] }
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    NotificationList:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/NotificationMeta" }
        unread: { type: integer }

    Profile:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        bio: { type: string }
        avatar_url: { type: string, description: 来自 Qoder 账号头像，不接受客户端写入 }

    ExportBundle:
      type: object
      required: [exported_at, works, skills, albums]
      properties:
        exported_at: { type: string, format: date-time }
        profile: { $ref: "#/components/schemas/Profile" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/AssetMeta" }
        works:
          type: array
          items: { $ref: "#/components/schemas/WorkMeta" }
        skills:
          type: array
          items: { type: object }
        albums:
          type: array
          items: { $ref: "#/components/schemas/AlbumMeta" }
        comments:
          type: array
          items: { type: object }
        likes:
          type: array
          items: { type: object }
        tasks:
          type: array
          items: { type: object }
        submissions:
          type: array
          items: { type: object }
        notifications:
          type: array
          items: { type: object }
